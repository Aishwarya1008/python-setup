name: python-setup

on:
  push:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Requirement
        run: echo "Exact String Expected"
      - name: Python setup
        uses: actions/setup-python@v4 and python-version: '3.9'
      - name: Dependency installation
        run: pip install pytest flake8
      - name: Python version verification
        run: python --version
      - name: Flake8 check
        run: flake8 --version
      - name: Pytest check
        run: pytest --version 
